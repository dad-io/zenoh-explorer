[package]
name = "zenoh-explorer"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A native GUI application for exploring Zenoh networks"
license = "Apache-2.0"
authors = ["Zenoh Community"]
repository = "https://github.com/dad-io/zenoh-explorer"
keywords = ["zenoh", "network", "explorer", "gui", "client"]
categories = ["network-programming", "gui"]

[workspace]

[dependencies]
zenoh = { version = "1.7", features = ["unstable"] }
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11", "accesskit"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde_json = "1.0"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
seahash = "4.1"
rfd = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Line tables go to a separate .dSYM/.pdb/.dwp file that the release workflow
# uploads as a debug-symbols asset. The symbol table stays in the binary so that
# RUST_BACKTRACE output names functions.
debug = "line-tables-only"
split-debuginfo = "packed"
strip = "none"
