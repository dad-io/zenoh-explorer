name: Native GUI smoke check
description: Launch the built application and verify a nonblank rendered framebuffer
inputs:
  executable:
    description: Path to the already-built executable
    required: true
  target:
    description: Rust target, used to name the evidence artifact
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: '3.13'

    - name: Install screenshot checker
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-input Pillow==13.0.0

    - name: Test blank-frame detection
      shell: bash
      run: python -m unittest discover -s scripts -p test_gui_smoke.py -v

    - name: Install Linux virtual display and software OpenGL
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0

    - name: Prepare Windows software OpenGL
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        SMOKE_EXECUTABLE: ${{ inputs.executable }}
      run: ./scripts/prepare-windows-gui-smoke.ps1 -Executable $env:SMOKE_EXECUTABLE -Destination "$env:RUNNER_TEMP/zenoh-gui-runtime"

    - name: Launch and capture native window (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        GALLIUM_DRIVER: llvmpipe
        LP_NUM_THREADS: '2'
      run: python scripts/gui_smoke.py --executable "$env:RUNNER_TEMP/zenoh-gui-runtime/zenoh-explorer.exe" --output-dir "$env:RUNNER_TEMP/zenoh-gui-evidence"

    - name: Launch and capture native window (Linux)
      if: runner.os == 'Linux'
      shell: bash
      env:
        SMOKE_EXECUTABLE: ${{ inputs.executable }}
        LIBGL_ALWAYS_SOFTWARE: '1'
        GALLIUM_DRIVER: llvmpipe
        LP_NUM_THREADS: '2'
      run: |
        unset WAYLAND_DISPLAY
        xvfb-run -a -s '-screen 0 1600x1000x24' \
          python scripts/gui_smoke.py --executable "$SMOKE_EXECUTABLE" --output-dir "$RUNNER_TEMP/zenoh-gui-evidence"

    - name: Upload GUI screenshots and diagnostics
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: gui-smoke-${{ inputs.target }}
        path: ${{ runner.temp }}/zenoh-gui-evidence/
        if-no-files-found: warn
